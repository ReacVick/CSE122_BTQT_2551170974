<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài 16 - Danh sách việc cần làm</title>
  <link rel="stylesheet" href="bai16.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Danh sách việc cần làm</h1>
      <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
    </header>

    <div class="app-body">
      <div class="add-row">
        <input type="text" id="taskInput" placeholder="Nhập việc cần làm..." autocomplete="off">
        <button type="button" id="addBtn" class="btn-add">Thêm</button>
      </div>

      <ul class="task-list" id="taskList"></ul>

      <p class="counter" id="counter"></p>
    </div>
  </main>

  <script>
    const input = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('taskList');
    const counter = document.getElementById('counter');

    // Dữ liệu ban đầu giống hình minh hoạ
    const tasks = [
      { id: 1, text: 'Đọc chương HTML5 cơ bản', done: true },
      { id: 2, text: 'Làm bài tập CSS Grid', done: false },
      { id: 3, text: 'Quay video OBS nộp bài', done: false }
    ];
    let nextId = 4;

    function render() {
      list.innerHTML = '';

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task' + (task.done ? ' done' : '');

        // Ô đánh dấu
        const check = document.createElement('button');
        check.type = 'button';
        check.className = 'check';
        check.setAttribute('role', 'checkbox');
        check.setAttribute('aria-checked', task.done);
        check.setAttribute('aria-label', 'Đánh dấu hoàn thành');
        check.addEventListener('click', () => toggleTask(task.id));

        // Nội dung việc (bấm vào để đổi trạng thái)
        const label = document.createElement('span');
        label.className = 'task-text';
        label.textContent = task.text;
        label.addEventListener('click', () => toggleTask(task.id));

        // Nút xoá
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn-delete';
        del.textContent = 'Xoá';
        del.addEventListener('click', () => deleteTask(task.id));

        li.append(check, label, del);
        list.appendChild(li);
      });

      updateCounter();
    }

    function updateCounter() {
      const remaining = tasks.filter(t => !t.done).length;
      if (tasks.length === 0) {
        counter.textContent = 'Chưa có việc nào. Hãy thêm việc đầu tiên!';
      } else if (remaining === 0) {
        counter.textContent = 'Tất cả các việc đã hoàn thành 🎉';
      } else {
        counter.textContent = 'Còn ' + remaining + ' việc chưa hoàn thành';
      }
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      tasks.push({ id: nextId++, text, done: false });
      input.value = '';
      input.focus();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      render();
    }

    function deleteTask(id) {
      const index = tasks.findIndex(t => t.id === id);
      if (index !== -1) tasks.splice(index, 1);
      render();
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
