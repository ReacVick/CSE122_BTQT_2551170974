<!DOCTYPE html>
<html>
<head>
    <title>Bốn Mùa</title>
    <link rel="stylesheet" href="stylebai1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="khung">
        <h2>BỐN MÙA</h2><br>
        <div class="xanh">
            Xuân về hoa nở khắp nơi<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm<br>

        </div>

        <hr>

        <div class="do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai<br>

        </div>

        <hr>

        <div class="xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường<br>

        </div>
    </div>
</body>
</html>
