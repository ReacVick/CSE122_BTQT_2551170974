<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai10</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>
    <form class="card">
        <div class="form-header">
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>
        <div class="form-body">
            <div class="row">
                <div class="group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" name="fullname" id="fullname" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="an.nv@tlu.edu.vn" required>
                </div>
            </div>
            <div class="row">
                <div class="group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" name="phone" id="phone" placeholder="0987654321" required>
                </div>
                <div class="group">
                    <label for="topic">Chủ đề</label>
                    <select name="topic" id="topic" required>
                        <option value="">Hỏi về khóa học</option>
                        <option value="">2026-2027</option>
                        <option value="">2025-2026</option>
                        <option value="">2024-2025</option>
                        <option value="">2023-2024</option>
                    </select>
                </div>
            </div>
            <div class="form-full">
                <label for="content">Nội dung</label>
                <textarea name="content" id="content" rows="4"  placeholder="Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ."></textarea>
            </div>
            <div class="form-check">
                <input type="checkbox">
                <label for="dongy" class="check">Tôi đồng ý nhận email phản hồi</label>
            </div>
            <div class="form-button">
                <button type="submit" class="one">Gửi liên hệ</button>
                <button type="reset" class="two">Nhập lại</button>
            </div>
        </div>
    </form>
</body>
</html>
