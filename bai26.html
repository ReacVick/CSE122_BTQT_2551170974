<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài 26 - Form đăng ký với Bootstrap</title>

  <!-- Bootstrap 5 CSS (qua CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <!-- Form đặt trong card, header nền xanh (bg-success) -->
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white text-center fs-4 py-3">
            Đăng ký tham gia CLB Lập trình Web
          </div>

          <div class="card-body p-4">
            <!-- row g-3: các ô xếp thành lưới, cách nhau 1rem -->
            <!-- Các ô có "required" thì trình duyệt tự kiểm tra khi bấm Đăng ký -->
            <form id="formDangKy" class="row g-3">

              <!-- col-md-6: màn hình vừa/lớn 2 ô cạnh nhau, màn hình nhỏ mỗi ô một hàng -->
              <div class="col-md-6">
                <label for="hoten" class="form-label">Họ và tên</label>
                <input type="text" class="form-control" id="hoten" placeholder="Nguyễn Văn A" required>
              </div>

              <div class="col-md-6">
                <label for="masv" class="form-label">Mã sinh viên</label>
                <input type="text" class="form-control" id="masv" placeholder="22xxxxxx" required>
              </div>

              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
              </div>

              <div class="col-md-6">
                <label for="sdt" class="form-label">Số điện thoại</label>
                <input type="tel" class="form-control" id="sdt" placeholder="09xxxxxxxx"
                       pattern="0[0-9]{9}" title="Số điện thoại gồm 10 chữ số, bắt đầu bằng 0" required>
              </div>

              <!-- col-12: chiếm cả hàng -->
              <div class="col-12">
                <label class="form-label d-block">Trình độ</label>
                <!-- form-check-inline: các lựa chọn nằm trên cùng một dòng -->
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="trinhdo" id="coban" value="Cơ bản" checked>
                  <label class="form-check-label" for="coban">Cơ bản</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="trinhdo" id="kha" value="Khá">
                  <label class="form-check-label" for="kha">Khá</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="trinhdo" id="tot" value="Tốt">
                  <label class="form-check-label" for="tot">Tốt</label>
                </div>
              </div>

              <div class="col-12">
                <label for="lop" class="form-label">Chọn lớp</label>
                <select class="form-select" id="lop" required>
                  <option value="67CNTT1" selected>67CNTT1</option>
                  <option value="67CNTT2">67CNTT2</option>
                  <option value="67KTPM1">67KTPM1</option>
                </select>
              </div>

              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="camket" required>
                  <label class="form-check-label" for="camket">Tôi cam kết tự làm bài và quay video OBS</label>
                </div>
              </div>

              <!-- d-grid: nút full chiều rộng trên màn hình nhỏ; d-md-flex + justify-content-md-end: dồn phải trên màn hình lớn -->
              <div class="col-12 d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                <button type="submit" class="btn btn-success">Đăng ký</button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Sự kiện "submit" chỉ chạy khi mọi ô required đã hợp lệ
    document.getElementById('formDangKy').addEventListener('submit', function (e) {
      e.preventDefault();               // không tải lại trang
      alert('Đăng ký thành công!');
      this.reset();                     // xóa dữ liệu trong form
    });
  </script>
</body>
</html>
