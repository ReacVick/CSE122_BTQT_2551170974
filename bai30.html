<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài 30 - Bảng điều khiển</title>

  <!-- Bootstrap 5 CSS (qua CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Từ màn hình vừa trở lên: sidebar rộng cố định 230px, không bị co lại */
    @media (min-width: 768px) {
      .sidebar {
        width: 230px;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Khung ngoài: điện thoại xếp dọc (sidebar trên, nội dung dưới), máy tính xếp ngang (flex-md-row) -->
  <div class="d-flex flex-column flex-md-row min-vh-100">

    <!-- SIDEBAR: nền tối, tách khỏi phần nội dung -->
    <aside class="sidebar bg-dark text-white p-3">
      <div class="fw-bold fs-6">CSE.TLU Admin</div>
      <hr>
      <!-- nav-pills flex-column: menu dọc, mục đang chọn (active) có nền xanh -->
      <ul class="nav nav-pills flex-column gap-1">
        <li class="nav-item"><a class="nav-link active" href="#">Bảng điều khiển</a></li>
        <li class="nav-item"><a class="nav-link text-white-50" href="#">Bài tập</a></li>
        <li class="nav-item"><a class="nav-link text-white-50" href="#">Sinh viên</a></li>
        <li class="nav-item"><a class="nav-link text-white-50" href="#">Điểm số</a></li>
      </ul>
    </aside>

    <!-- NỘI DUNG CHÍNH: flex-grow-1 để chiếm hết phần còn lại -->
    <main class="flex-grow-1 bg-light p-4">

      <!-- Dòng đầu: tiêu đề bên trái, badge và nút bên phải -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 mb-0">Bảng điều khiển</h1>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-warning text-dark">3 bài mới</span>
          <button type="button" class="btn btn-primary btn-sm">Xuất báo cáo</button>
        </div>
      </div>

      <!-- 4 THẺ THỐNG KÊ: col-md-3 => máy tính 4 thẻ một hàng (điện thoại 2 thẻ một hàng) -->
      <div class="row g-3 mb-4">

        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="text-muted small">Sinh viên</div>
              <div class="fs-3 fw-bold">128</div>
              <!-- Thanh tiến độ: độ dài do style="width: ...%" quyết định -->
              <div class="progress" style="height: 6px;">
                <div class="progress-bar bg-primary" role="progressbar" style="width: 80%"
                     aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="text-muted small">Đã nộp</div>
              <div class="fs-3 fw-bold">96</div>
              <!-- 96 / 128 = 75% -->
              <div class="progress" style="height: 6px;">
                <div class="progress-bar bg-success" role="progressbar" style="width: 75%"
                     aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="text-muted small">Chưa nộp</div>
              <div class="fs-3 fw-bold">32</div>
              <!-- 32 / 128 = 25% -->
              <div class="progress" style="height: 6px;">
                <div class="progress-bar bg-danger" role="progressbar" style="width: 25%"
                     aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="text-muted small">Điểm TB</div>
              <div class="fs-3 fw-bold">7.8</div>
              <!-- 7.8 / 10 = 78% -->
              <div class="progress" style="height: 6px;">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 78%"
                     aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- DANH SÁCH TIẾN ĐỘ THEO CHƯƠNG: mỗi dòng có tên chương và badge phần trăm -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold">Tiến độ theo chương</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 1 — HTML5
            <span class="badge bg-success">100%</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 2 — JavaScript
            <span class="badge bg-info text-dark">82%</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 3 — CSS3
            <span class="badge bg-info text-dark">74%</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 4 — Bootstrap 5
            <span class="badge bg-secondary">45%</span>
          </li>
        </ul>
      </div>

    </main>
  </div>

</body>
</html>
